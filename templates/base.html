<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>{{ title }} · vibe-dispatch</title>
  <link rel="preload" href="static/fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin>
  {% block head %}{% endblock %}
  {# 共享主题后加载，覆盖各页保留的旧样式。 #}
  <link rel="stylesheet" href="static/style.css">
</head>
<body>
  <header class="site-header">
    <nav class="container" aria-label="主导航">
      <ul>
        {% for name, label in pages %}
        <li><a href="{{ name }}.html"{% if current_page == name %} aria-current="page"{% endif %}>{{ label }}</a></li>
        {% endfor %}
      </ul>
    </nav>
  </header>
  <main class="container{% if current_page != 'index' %} docs{% endif %}">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <div class="container">
      <p><a href="https://github.com/alezhao/vibe-dispatch">vibe-dispatch · GitHub</a></p>
    </div>
  </footer>
</body>
</html>
